name: PR checks
on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        
      - name: Install dependencies
        run: yarn install --immutable

      - name: Build js
        run: yarn build
    
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint js and scss
        run: yarn run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test js
        run: yarn run test
        
  check-inclusive-naming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Check inclusive naming
        uses: canonical-web-and-design/inclusive-naming@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail-on-error: true
          
  check-version-bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version is updated
        run: |
          set -euo pipefail

          VERSION_PATTERN='(?<="version": ")[^"]+'
          IGNORE_PATTERN='^(\.github/|README\.md$)'

          git fetch origin "${{ github.base_ref }}"
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -vP "$IGNORE_PATTERN" | grep -q .; then
            echo "No relevant changes, skipping version check."
            exit 0
          fi

          if ! echo "$CHANGED_FILES" | grep -qx 'package.json'; then
            echo "::error::Files were changed but package.json was not updated. Please bump the version in package.json."
            exit 1
          fi

          OLD_VERSION=$(git show "$BASE_SHA:package.json" | grep -oP "$VERSION_PATTERN" || true)
          NEW_VERSION=$(grep -oP "$VERSION_PATTERN" package.json || true)

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::package.json was modified but the version string was not changed ($OLD_VERSION). Please bump the version."
            exit 1
          fi

          echo "Version bumped from $OLD_VERSION to $NEW_VERSION."
